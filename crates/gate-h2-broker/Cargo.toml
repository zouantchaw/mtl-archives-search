[package]
name = "gate-h2-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
default = []
test-fault-injection = []

[lib]
name = "gate_h2_broker"

[[bin]]
name = "gate-h2-broker"
path = "src/bin/broker.rs"

[[bin]]
name = "gate-h2-stage-runtime"
path = "src/bin/stage_runtime.rs"

[[bin]]
name = "gate-h2-publish-noreplace"
path = "src/bin/publish_noreplace.rs"

[[bin]]
name = "gate-h2-secure-candidate-read"
path = "src/bin/secure_candidate_read.rs"

[[bin]]
name = "gate-h2-podman-supervisor"
path = "src/bin/podman_supervisor.rs"

[[bin]]
name = "gate-h2-post-begin-handoff"
path = "src/bin/post_begin_handoff.rs"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
hex = "=0.4.3"
httparse = "=1.10.1"
idna = "=1.1.0"
libc = "=0.2.186"
rustls = { version = "=0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "=0.8.2"
rustls-pki-types = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.18"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
rcgen = { version = "=0.14.7", features = ["aws_lc_rs"] }
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
