<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Dot-based M shape - representing the point cloud -->
  <!-- Left vertical of M -->
  <circle cx="120" cy="120" r="20" fill="#ff9500"/>
  <circle cx="120" cy="180" r="18" fill="#ffd60a"/>
  <circle cx="120" cy="240" r="20" fill="#34c759"/>
  <circle cx="120" cy="300" r="18" fill="#34c759"/>
  <circle cx="120" cy="360" r="20" fill="#0a84ff"/>
  <circle cx="120" cy="420" r="18" fill="#0a84ff"/>

  <!-- Left diagonal down to center -->
  <circle cx="170" cy="160" r="16" fill="#ff9500"/>
  <circle cx="210" cy="210" r="18" fill="#ffd60a"/>
  <circle cx="256" cy="270" r="22" fill="#fafafa"/>

  <!-- Right diagonal up from center -->
  <circle cx="302" cy="210" r="18" fill="#ffd60a"/>
  <circle cx="342" cy="160" r="16" fill="#ff9500"/>

  <!-- Right vertical of M -->
  <circle cx="392" cy="120" r="20" fill="#ff9500"/>
  <circle cx="392" cy="180" r="18" fill="#ffd60a"/>
  <circle cx="392" cy="240" r="20" fill="#34c759"/>
  <circle cx="392" cy="300" r="18" fill="#34c759"/>
  <circle cx="392" cy="360" r="20" fill="#0a84ff"/>
  <circle cx="392" cy="420" r="18" fill="#0a84ff"/>

  <!-- Scatter dots for point cloud effect -->
  <circle cx="160" cy="380" r="8" fill="#8e8e93" opacity="0.6"/>
  <circle cx="200" cy="350" r="6" fill="#8e8e93" opacity="0.5"/>
  <circle cx="256" cy="380" r="10" fill="#8e8e93" opacity="0.4"/>
  <circle cx="310" cy="360" r="7" fill="#8e8e93" opacity="0.5"/>
  <circle cx="350" cy="390" r="8" fill="#8e8e93" opacity="0.6"/>
</svg>
