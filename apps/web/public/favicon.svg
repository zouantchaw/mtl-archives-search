<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>

  <!-- Dot-based M shape - matching the main brand -->
  <!-- Left vertical -->
  <circle cx="22" cy="22" r="6" fill="#ff9500"/>
  <circle cx="22" cy="38" r="5" fill="#ffd60a"/>
  <circle cx="22" cy="52" r="6" fill="#34c759"/>
  <circle cx="22" cy="66" r="5" fill="#34c759"/>
  <circle cx="22" cy="80" r="6" fill="#0a84ff"/>

  <!-- Left diagonal -->
  <circle cx="35" cy="32" r="5" fill="#ff9500"/>
  <circle cx="45" cy="44" r="5" fill="#ffd60a"/>

  <!-- Center -->
  <circle cx="50" cy="55" r="7" fill="#fafafa"/>

  <!-- Right diagonal -->
  <circle cx="55" cy="44" r="5" fill="#ffd60a"/>
  <circle cx="65" cy="32" r="5" fill="#ff9500"/>

  <!-- Right vertical -->
  <circle cx="78" cy="22" r="6" fill="#ff9500"/>
  <circle cx="78" cy="38" r="5" fill="#ffd60a"/>
  <circle cx="78" cy="52" r="6" fill="#34c759"/>
  <circle cx="78" cy="66" r="5" fill="#34c759"/>
  <circle cx="78" cy="80" r="6" fill="#0a84ff"/>

  <!-- Scatter dots -->
  <circle cx="35" cy="75" r="3" fill="#8e8e93" opacity="0.5"/>
  <circle cx="50" cy="78" r="3" fill="#8e8e93" opacity="0.4"/>
  <circle cx="65" cy="75" r="3" fill="#8e8e93" opacity="0.5"/>
</svg>
