<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MTL Archives Explorer</title>
    <meta name="description" content="A similarity map of one published MTL Archives snapshot. Proximity is model similarity, not geography or historical certainty." />
    <meta name="theme-color" content="#F5F2EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Spectral:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var params = new URLSearchParams(location.search);
        var theme = params.get('theme');
        if (theme !== 'light' && theme !== 'dark') theme = localStorage.getItem('mtl-explorer-theme');
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        var lang = params.get('lang');
        if (lang !== 'en' && lang !== 'fr') lang = localStorage.getItem('mtl-explorer-locale');
        document.documentElement.lang = lang === 'en' ? 'en' : 'fr';
      } catch (error) {}
    </script>
    <script src="https://cdn.seline.com/seline.js" data-token="ba441af9ffc2d81" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
